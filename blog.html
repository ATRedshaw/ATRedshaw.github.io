<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Alex Redshaw</title>
    
    <!-- Fonts & Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/custom.css">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="fixed w-full bg-white/90 backdrop-blur-md z-50 border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html" class="text-xl font-bold text-slate-900 tracking-tight">Alex Redshaw<span class="text-blue-600">.</span></a>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="nav-link text-sm font-medium transition-colors">Home</a>
                    <a href="experience.html" class="nav-link text-sm font-medium transition-colors">Experience</a>
                    <a href="projects.html" class="nav-link text-sm font-medium transition-colors">Projects</a>
                    <a href="blog.html" class="nav-link text-sm font-medium transition-colors">Blog</a>
                </div>
                <div class="flex items-center md:hidden">
                    <button id="mobile-menu-btn" class="text-slate-600 hover:text-slate-900 focus:outline-none">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-slate-100">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="index.html" class="block px-3 py-2 rounded-md text-base font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50">Home</a>
                <a href="experience.html" class="block px-3 py-2 rounded-md text-base font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50">Experience</a>
                <a href="projects.html" class="block px-3 py-2 rounded-md text-base font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50">Projects</a>
                <a href="blog.html" class="block px-3 py-2 rounded-md text-base font-medium text-blue-600 bg-blue-50">Blog</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow pt-24 pb-20">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <header class="mb-12 text-center fade-in-section">
                <h1 class="text-4xl font-bold text-slate-900 mb-4">Blog</h1>
                <p class="text-slate-600 max-w-2xl mx-auto">Thoughts, tutorials, and insights on Data Science and Engineering.</p>
            </header>

            <!-- Filter Controls -->
            <div class="flex justify-center mb-12 fade-in-section">
                <div id="blog-filter-container" class="flex flex-wrap justify-center gap-2">
                    <!-- Filters injected here -->
                </div>
            </div>

            <!-- Blog Grid -->
            <div id="blog-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Blog Cards injected here -->
            </div>

        </div>
    </main>

    <!-- Modal Template (Reused) -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] hidden opacity-0 flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white w-full max-w-4xl max-h-[90vh] rounded-2xl shadow-2xl overflow-hidden flex flex-col scale-95 opacity-0 transform">
            <div class="flex justify-end p-4 border-b border-slate-100 bg-white sticky top-0 z-10">
                <button id="modal-close" class="text-slate-400 hover:text-slate-600 focus:outline-none p-2 rounded-full hover:bg-slate-100 transition-colors">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6 md:p-12 overflow-y-auto custom-scrollbar bg-white">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-12">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="text-slate-500 text-sm">
                &copy; <span id="current-year"></span> Alex Redshaw. All rights reserved.
            </div>
            <div class="flex gap-6" id="footer-socials"></div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/blog.js"></script>
</body>
</html>
