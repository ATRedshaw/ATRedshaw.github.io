<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal | Alex Redshaw</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;400;500;600&family=Montserrat:wght@300;400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark-reasonable.min.css">
    
    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        midnight: '#0D1B2A',   // Very Deep Teal/Navy base
                        'surface-light': '#1B263B', // Card background
                        porcelain: '#F4F1EA',
                        terracotta: '#E07A5F',
                        fern: '#415A77',       // Muted Blue-Grey
                    },
                    fontFamily: {
                        serif: ['Fraunces', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/custom.css">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="bg-midnight text-porcelain font-sans flex flex-col min-h-screen selection:bg-terracotta/30 selection:text-terracotta">

    <!-- Texture Overlay -->
    <div class="fixed inset-0 pointer-events-none bg-grain op-50 z-[1000] mix-blend-overlay"></div>

    <!-- Navigation -->
    <nav class="fixed w-full bg-midnight/90 backdrop-blur-md z-40 border-b border-white/5">
        <div class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-12">
            <div class="flex justify-between items-center h-24">
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html" class="text-2xl font-serif font-semibold text-porcelain tracking-tight hover:text-terracotta transition-colors duration-300">AR<span class="text-terracotta">.</span></a>
                </div>
                <!-- Desktop Menu -->
                <div class="hidden md:flex space-x-12">
                    <a href="index.html" class="nav-link text-xs font-mono font-medium uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-all duration-300">Home</a>
                    <a href="experience.html" class="nav-link text-xs font-mono font-medium uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-all duration-300">Experience</a>
                    <a href="projects.html" class="nav-link text-xs font-mono font-medium uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-all duration-300">Projects</a>
                    <a href="blog.html" class="nav-link active text-xs font-mono font-medium uppercase tracking-widest text-terracotta transition-all duration-300">Blog</a>
                </div>
                <!-- Mobile Menu Button -->
                <div class="flex items-center md:hidden">
                    <button id="mobile-menu-btn" class="text-porcelain hover:text-terracotta focus:outline-none transition-colors">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-midnight border-t border-white/5 absolute w-full">
            <div class="px-6 py-6 space-y-4">
                <a href="index.html" class="block text-sm font-mono uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-colors">Home</a>
                <a href="experience.html" class="block text-sm font-mono uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-colors">Experience</a>
                <a href="projects.html" class="block text-sm font-mono uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-colors">Projects</a>
                <a href="blog.html" class="block text-sm font-mono uppercase tracking-widest text-terracotta">Blog</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow pt-32 pb-24">
        <div class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-12">
            
            <!-- Hero -->
            <header class="mb-20 fade-in-section">
                <span class="block text-terracotta text-xs font-mono mb-4 uppercase tracking-[0.2em]">Writing</span>
                <h1 class="text-5xl md:text-7xl font-serif text-porcelain mb-6 tracking-tight">Journal</h1>
                <p class="text-fern max-w-2xl text-lg font-light leading-relaxed border-l border-white/10 pl-6">
                    Observations on engineering, data science, and the evolving landscape of technology.
                </p>
            </header>

            <!-- Filter Controls -->
            <div class="flex flex-wrap gap-4 mb-16 fade-in-section" id="blog-filter-container">
                <!-- Filters injected by JS -->
            </div>

            <!-- Blog Grid -->
            <div id="blog-grid" class="grid grid-cols-1 gap-4">
                <!-- Blog Rows injected by JS -->
            </div>

        </div>
    </main>
    
    <!-- Modal (Consistent with Projects.html) -->
    <div id="modal-overlay" class="fixed inset-0 bg-midnight/90 backdrop-blur-md z-[60] hidden opacity-0 flex items-center justify-center p-0 md:p-8 transition-opacity duration-300">
        <div id="modal-content" class="bg-midnight border border-white/10 w-full max-w-5xl h-full md:max-h-[85vh] md:rounded-none shadow-2xl overflow-hidden flex flex-col scale-95 opacity-0 transform transition-all duration-300 relative">
            
            <button id="modal-close" class="absolute top-6 right-6 z-50 text-porcelain hover:text-terracotta focus:outline-none p-2 border border-white/10 bg-midnight/50 backdrop-blur-sm transition-colors group">
                <i data-lucide="x" class="w-6 h-6 group-hover:rotate-90 transition-transform duration-300"></i>
            </button>
            
            <div id="modal-body" class="overflow-y-auto custom-scrollbar h-full p-8 md:p-16">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>


    <!-- Footer -->
    <footer class="bg-midnight border-t border-white/5 py-16">
        <div class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-12 flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="text-porcelain/40 text-xs font-mono uppercase tracking-widest">
                &copy; <span id="current-year"></span> Alex Redshaw
            </div>
            <div class="flex gap-8" id="footer-socials">
                <!-- Socials Injected -->
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/blog.js"></script>
</body>
</html>
