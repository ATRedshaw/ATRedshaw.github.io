{% extends "base.html" %}
{% block content %}
<main class="grow pt-32 pb-24">
    <div class="max-w-4xl mx-auto px-6 sm:px-8 lg:px-12">
        <h1 class="text-4xl font-serif text-porcelain mb-8">Journal</h1>
        <p class="text-fern text-lg mb-8">These articles have moved to their own pages. Choose a post below.</p>
        <ul class="space-y-6">
            {% for post in posts %}
            <li><a href="{{ post.url }}" data-legacy-id="{{ post.slug }}" class="text-terracotta hover:underline">{{ post.title }}</a></li>
            {% endfor %}
        </ul>
    </div>
</main>
{% endblock %}
