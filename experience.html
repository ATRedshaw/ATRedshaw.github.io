<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience - Alex Redshaw</title>
    
    <!-- Fonts & Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/custom.css">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <!-- Included just in case -->
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="fixed w-full bg-white/90 backdrop-blur-md z-50 border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html" class="text-xl font-bold text-slate-900 tracking-tight">Alex Redshaw<span class="text-blue-600">.</span></a>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="nav-link text-sm font-medium transition-colors">Home</a>
                    <a href="experience.html" class="nav-link text-sm font-medium transition-colors">Experience</a>
                    <a href="projects.html" class="nav-link text-sm font-medium transition-colors">Projects</a>
                    <a href="blog.html" class="nav-link text-sm font-medium transition-colors">Blog</a>
                </div>
                <div class="flex items-center md:hidden">
                    <button id="mobile-menu-btn" class="text-slate-600 hover:text-slate-900 focus:outline-none">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-slate-100">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="index.html" class="block px-3 py-2 rounded-md text-base font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50">Home</a>
                <a href="experience.html" class="block px-3 py-2 rounded-md text-base font-medium text-blue-600 bg-blue-50">Experience</a>
                <a href="projects.html" class="block px-3 py-2 rounded-md text-base font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50">Projects</a>
                <a href="blog.html" class="block px-3 py-2 rounded-md text-base font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50">Blog</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow pt-24 pb-20">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <header class="mb-16 text-center fade-in-section">
                <h1 class="text-4xl font-bold text-slate-900 mb-4">Experience & Skills</h1>
                <p class="text-slate-600 max-w-2xl mx-auto">My professional journey, education, and technical expertise.</p>
            </header>

            <!-- Skills Section -->
            <section class="mb-20">
                <div class="flex items-center gap-3 mb-8 fade-in-section">
                    <i data-lucide="cpu" class="w-6 h-6 text-blue-600"></i>
                    <h2 class="text-2xl font-bold text-slate-800">Technical Skills</h2>
                </div>
                
                <div id="skills-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
                    <!-- Skills Categories JS Injected Here -->
                </div>

                <!-- Certifications Subsection -->
                 <div class="fade-in-section">
                    <h3 class="text-xl font-semibold text-slate-800 mb-6 flex items-center gap-2">
                        <i data-lucide="award" class="w-5 h-5 text-amber-500"></i> Certifications
                    </h3>
                    <div id="certifications-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Certifications JS Injected Here -->
                    </div>
                </div>
            </section>

            <!-- Timeline Section -->
            <section>
                <div class="flex items-center gap-3 mb-10 fade-in-section">
                    <i data-lucide="history" class="w-6 h-6 text-blue-600"></i>
                    <h2 class="text-2xl font-bold text-slate-800">Journey</h2>
                </div>
                
                <div class="relative">
                    <div class="timeline-line hidden sm:block"></div>
                    <div id="timeline-container" class="space-y-8">
                        <!-- Timeline Entries JS Injected Here -->
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-12">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="text-slate-500 text-sm">
                &copy; <span id="current-year"></span> Alex Redshaw. All rights reserved.
            </div>
            <div class="flex gap-6" id="footer-socials"></div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/experience.js"></script>
</body>
</html>
