<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Alex Redshaw</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;400;500;600;700&family=Montserrat:wght@200;300;400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['Fraunces', 'serif'],
                        mono: ['Space Mono', 'monospace'],
                    },
                    colors: {
                        midnight: '#0D1B2A',   // Very Deep Teal/Navy base
                        charcoal: '#1B263B',   // Lighter Navy/Charcoal
                        cream: '#F4F1EA',      // Muted Cream
                        fern: '#415A77',       // Muted Blue-Grey
                        terracotta: '#E07A5F', // Accent
                        porcelain: '#F4F1EA',  // Same as cream for consistency
                        
                        // Semantic mapping
                        surface: '#0D1B2A',    // Main dark background
                        'surface-light': '#1B263B', // Card background
                        text: '#F4F1EA',       // Main text
                        muted: '#778DA9',      // Secondary text
                        accent: '#E07A5F',     // Highlights
                    },
                    backgroundImage: {
                        'grain': "url('data:image/svg+xml,%3Csvg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"%3E%3Cfilter id=\"noiseFilter\"%3E%3CfeTurbulence type=\"fractalNoise\" baseFrequency=\"0.65\" numOctaves=\"3\" stitchTiles=\"stitch\"/%3E%3C/filter%3E%3Crect width=\"100%25\" height=\"100%25\" filter=\"url(%23noiseFilter)\" opacity=\"0.05\"/%3E%3C/svg%3E')",
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="css/custom.css">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="bg-midnight text-porcelain font-sans antialiased selection:bg-terracotta selection:text-white relative overflow-x-hidden">

    <!-- Grain Overlay -->
    <div class="fixed inset-0 pointer-events-none bg-grain opacity-20 z-[100]"></div>

    <!-- Navigation -->
    <nav class="fixed w-full bg-midnight/90 backdrop-blur-md z-40 border-b border-white/5">
        <div class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-12">
            <div class="flex justify-between items-center h-24">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html" class="text-2xl font-serif font-semibold text-porcelain tracking-tight hover:text-terracotta transition-colors duration-300">
                        AR<span class="text-terracotta">.</span>
                    </a>
                </div>
                
                <!-- Desktop Menu -->
                <div class="hidden md:flex space-x-12">
                    <a href="index.html" class="nav-link text-xs font-mono font-medium uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-all duration-300">Home</a>
                    <a href="experience.html" class="nav-link text-xs font-mono font-medium uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-all duration-300">Experience</a>
                    <a href="projects.html" class="nav-link active text-xs font-mono font-medium uppercase tracking-widest text-terracotta transition-all duration-300">Projects</a>
                    <a href="blog.html" class="nav-link text-xs font-mono font-medium uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-all duration-300">Blog</a>
                </div>
                
                <!-- Mobile Menu Button -->
                <div class="flex items-center md:hidden">
                    <button id="mobile-menu-btn" class="text-porcelain hover:text-terracotta focus:outline-none transition-colors">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-midnight border-t border-white/5 absolute w-full">
            <div class="px-6 py-6 space-y-4">
                <a href="index.html" class="block text-sm font-mono uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-colors">Home</a>
                <a href="experience.html" class="block text-sm font-mono uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-colors">Experience</a>
                <a href="projects.html" class="block text-sm font-mono uppercase tracking-widest text-terracotta">Projects</a>
                <a href="blog.html" class="block text-sm font-mono uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-colors">Blog</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow pt-32 pb-20">
        <div class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-12">
            
            <header class="mb-16 fade-in-section">
                <span class="block text-terracotta text-xs font-mono mb-4 uppercase tracking-[0.2em]">Selected Work</span>
                <h1 class="text-5xl md:text-7xl font-serif font-light text-porcelain mb-6">Projects</h1>
                <p class="text-fern text-lg font-light leading-relaxed max-w-2xl border-l border-white/10 pl-6">
                    A collection of data science initiatives, machine learning models, and engineering challenges I've tackled.
                </p>
            </header>

            <!-- Filter Controls -->
            <div class="flex flex-wrap gap-4 mb-16 fade-in-section" id="filter-container">
                <!-- Filters injected via JS -->
            </div>

            <!-- Projects Grid -->
            <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-12">
                <!-- Project Cards injected via JS -->
            </div>

        </div>
    </main>

    <!-- Modal Template -->
    <div id="modal-overlay" class="fixed inset-0 bg-midnight/90 backdrop-blur-md z-[60] hidden opacity-0 flex items-center justify-center p-0 md:p-8 transition-opacity duration-300">
        <div id="modal-content" class="bg-midnight border border-white/10 w-full max-w-5xl h-full md:max-h-[85vh] md:rounded-none shadow-2xl overflow-hidden flex flex-col scale-95 opacity-0 transform transition-all duration-300 relative">
            
            <button id="modal-close" class="absolute top-6 right-6 z-50 text-porcelain hover:text-terracotta focus:outline-none p-2 border border-white/10 bg-midnight/50 backdrop-blur-sm transition-colors group">
                <i data-lucide="x" class="w-6 h-6 group-hover:rotate-90 transition-transform duration-300"></i>
            </button>
            
            <div id="modal-body" class="overflow-y-auto custom-scrollbar h-full">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-white/5 py-12 bg-midnight">
        <div class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-12 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="text-fern text-xs font-mono uppercase tracking-widest">
                &copy; <span id="current-year"></span> Alex Redshaw.
            </div>
            <div class="flex gap-8" id="footer-socials">
                <!-- Social Links via JS -->
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/projects.js"></script>
</body>
</html>
