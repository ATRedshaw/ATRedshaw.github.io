  - title: "FPL Challenge Optimisations"
    description: "Engine to pick the optimal Fantasy Premier League Challenge squad each gameweek. Adjusts ML point projections for bespoke scoring rules, solves an integer linear programme to maximise expected points, and includes a hindsight pass to compare predicted and actual outcomes."
    tags: ["Machine Learning", "Optimisation", "Python", "Data Analysis", "Web Development"]
