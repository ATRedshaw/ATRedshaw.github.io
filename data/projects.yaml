    description: "Scraped and preprocessed extensive shot data from Europe's top five leagues to develop a bespoke Expected Goals (xG) model using Scikit-learn. Built an interactive web application for real time plotting and visualisation."
    tags: ["Machine Learning", "Scikit-learn", "Python", "Data Visualisation"]
