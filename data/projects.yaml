projects:
  - title: "Multimodal LLM Research for AAC"
    description: "Ongoing research project investigating the integration of multimodal LLMs to assist individuals with learning disabilities and stroke-induced speech impairments. Developed a proof-of-concept framework currently showing statistically significant improvements in communication rates."
    tags: ["Generative AI", "LLMs", "Research", "Python"]
