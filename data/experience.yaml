entries:
  - type: "work"
    title: "Tech, Data & Analytics Senior Associate"
    organization: "PwC"
    date: "September 2020 - Present"
    description: "At PwC my work has sat at the intersection of data science, machine learning and data engineering for financial services clients. I started as a technology degree apprentice in Leeds, building SQL pipelines, interactive dashboards and forecasting models, before rejoining as an Associate in London in August 2024 and being promoted to Senior Associate in July 2025. Since then I have taken on more complex ML and engineering work, including a custom fine-tuned LLM solution for unstructured data extraction that reduced manual processing by 85% and improved data accuracy by 10%. I have also designed Python ETL pipelines to process and reconcile over 10 million daily banking transactions across three major financial services clients, working within strict global regulatory audit requirements. On the modelling side, I developed Scikit-learn regression models to forecast resource and capital expenditure, supporting a 10% reduction in client operational costs, and visualised the results in Tableau. I also deployed a time series forecasting model for offshore delivery centre resource demand, improving forecast accuracy by 20% and saving around 25 hours of manual work each month. Across these projects I have had to make model outputs clear in technical workshops and senior leadership presentations."
  - type: "education"
    title: "BSc Computer Science (Digital & Technology Solutions)"
    organization: "University of Leeds / PwC"
    date: "September 2020 - June 2024"
    description: "I completed a Level 6 Digital and Technology Solutions Degree Apprenticeship with PwC. Awarded a 2:1 (Upper Second-Class Honours) overall, including first-class grades in Machine Learning, Information Visualisation and Data Science modules. I also achieved a first-class grade in my dissertation on probabilistic football event machine learning models."
  - type: "education"
    title: "International Baccalaureate Diploma Programme"
    organization: "Dartford Grammar School"
    date: "September 2018 - July 2020"
    description: "I studied the International Baccalaureate Diploma Programme at Sixth Form and was awarded 43 out of 45 points (Triple A* A-Level equivalent). I studied Computer Science (7), Economics (7) and English (7) at Higher Level alongside Latin (7), Mathematics (6) and Classics (6) at Standard Level."
  - type: "education"
    title: "GCSEs"
    organization: "Dartford Grammar School"
    date: "September 2013 - August 2018"
    description: "I achieved seven Level 9s, two Level 8s, one Level 7 and one A grade at GCSE. My Level 9 subjects included Computer Science, English Literature, Geography, History, Biology, Chemistry and Physics. I also studied Mathematics (level 8), Latin (level 8), English Language (level 7) and Japanese (grade A)."
  - type: "certification"
    title: "Microsoft Certified: Azure Data Scientist Associate"
    organization: "Microsoft"
    date: "June 2025 - June 2027"
    description: "Validated expertise in implementing and running machine learning workloads, particularly in the Azure cloud environment."
  - type: "certification"
    title: "Microsoft Certified: Azure AI Fundamentals"
    organization: "Microsoft"
    date: "March 2025"
    description: "Demonstrated foundational knowledge of machine learning and artificial intelligence concepts and related Microsoft Azure services."
