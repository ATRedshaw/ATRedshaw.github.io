entries:
  - type: "work"
    title: "Senior Data Science, AI & Resilience Associate"
    organization: "PwC"
    date: "September 2020 - Present"
    description: "I started my journey at PwC as a technology degree apprentice in Leeds, where I worked in data analytics. My early work focused on creating SQL pipelines, building interactive dashboards and developing forecasting models. After completing my degree I rejoined the firm as an associate in London in August 2024 before being promoted to Senior Associate in July 2025. In this time, I have taken on more complex engineering challenges. One major project involved building a custom fine-tuned LLM solution for a financial services client to automate their unstructured data extraction. This ended up cutting manual processing by 85% and increased data accuracy by 10%. I also spent time architecting Python ETL pipelines to process and reconcile over 10 million daily banking transactions, while making sure we met strict global regulatory audit standards across three major financial services clients. On the modelling side I developed Python regression models using Scikit-learn to forecast resource and capital expenditure, which helped reduce client operational costs by 10%. I visualised these savings in Tableau and also deployed a time series forecasting model to predict internal resource demand from offshore delivery centres. This improved our forecast accuracy by 20% and saved about 25 hours of manual work every month. Across all of these projects I have had to translate complex data/model outputs into actionable business strategies, so I have regularly led technical workshops and presented findings back to senior level leadership."
  - type: "education"
    title: "BSc Computer Science (Digital & Technology Solutions)"
    organization: "University of Leeds / PwC"
    date: "September 2020 - June 2024"
    description: "I completed a Level 6 Digital and Technology Solutions Degree Apprenticeship with PwC. Awarded a 2:1 (Upper Second-Class Honours) overall, including first-class grades in Machine Learning, Information Visualisation and Data Science modules. I also achieved a first-class grade in my dissertation on probabilistic football event machine learning models."
  - type: "education"
    title: "International Baccalaureate Diploma Programme"
    organization: "Dartford Grammar School"
    date: "September 2018 - July 2020"
    description: "I studied the International Baccalaureate Diploma Programme at Sixth Form and was awarded 43 out of 45 points (Triple A* A-Level equivalent). I studied Computer Science (7), Economics (7) and English (7) at Higher Level alongside Latin (7), Mathematics (6) and Classics (6) at Standard Level."
  - type: "education"
    title: "GCSEs"
    organization: "Dartford Grammar School"
    date: "September 2013 - August 2018"
    description: "I achieved seven Level 9s, two Level 8s, one Level 7 and one A grade at GCSE. My Level 9 subjects included Computer Science, English Literature, Geography, History, Biology, Chemistry and Physics. I also studied Mathematics (level 8), Latin (level 8), English Language (level 7) and Japanese (grade A)."
