about: |
  I am a data scientist and analyst who loves turning complex data into useful information. I enjoy taking on difficult problems and building creative solutions that blend technical expertise with sharp analytical thinking. My background in computer science and data science alongside my passion for sports analytics gives me a unique perspective when approaching new challenges, and this combination of skills was what ultimately led me to write my dissertation on 'Probabilistig Machine Learning Models for Football Analysis and Prediction', which achieved a first class grade.

  Over the past five years at PwC I have specialised in delivering high impact machine learning and data solutions for the financial services sector. I have a strong track record of architecting end to end AI systems including custom finetuned LLMs and ETL frameworks that handle millions of daily transactions. Beyond my commercial work I am currently researching multimodal LLMs for accessibility to explore how generative AI can drive positive social impact.

  Outside of work I am a massive sports fan. I love playing football and supporting Liverpool FC while also following Formula 1 and darts. I have a slight obsession with Fantasy Premier League. During the 2022/23 season I used a data driven approach to optimise my team selection and finished with an overall rank of 1326 out of over 10 million players. I also won 20 consecutive head to head ties to secure the Liverpool cup competition. I have come to terms with the fact that my FPL career peaked that year.

  I frequently apply my data analysis skills to personal sports projects. I have built statistical models and run analyses across all the sports I follow to experiment with different machine learning techniques. You can find some of my early write ups on this site with more on the way when time permits.
