about: |
  I am a data scientist and machine learning engineer with a background in computer science, analytics and applied modelling. My work sits between data engineering, statistical modelling and practical software delivery: building pipelines, training models, testing assumptions and turning the results into something people can actually use. That same mix led to my dissertation, 'Probabilistic Machine Learning Models for Football Analysis and Prediction', which received a first-class grade.

  Over the past five years at PwC I have specialised in machine learning and data solutions for financial services clients. I have built custom fine-tuned LLM systems for unstructured data extraction, designed Python ETL frameworks processing millions of transactions each day, and developed forecasting and regression models used in business planning. The work has usually involved the full path from messy source data to production-ready outputs, with enough explanation around the model behaviour for stakeholders to trust the result.

  Outside work I am usually watching or playing sport. I support Liverpool FC, follow Formula 1 and darts, and spend far too much time thinking about Fantasy Premier League. During the 2022/23 season I used a data-driven approach to optimise my team selection and finished with an overall rank of 1,326 out of more than 10 million players. I also won 20 consecutive head-to-head ties to secure the Liverpool cup competition. I have come to terms with the fact that my FPL career peaked that year.

  I use personal sports projects to try out modelling ideas that do not always fit neatly into client work. That has included football xG models, darts forecasting, FPL optimisation and crowd prediction for theme parks. Some of the write-ups are on this site, with more to follow when time permits.
