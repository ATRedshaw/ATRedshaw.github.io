<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Redshaw - Data Scientist</title>
    <meta name="description" content="Portfolio of Alex Redshaw, a Data Scientist specializing in Machine Learning and NLP.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;400;500;600;700&family=Montserrat:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['Fraunces', 'serif'],
                        mono: ['Space Mono', 'monospace'],
                    },
                    colors: {
                        matcha: '#E0E1DD',     // Off-white/platinum
                        midnight: '#0D1B2A',   // Very Deep Teal/Navy base
                        charcoal: '#1B263B',   // Lighter Navy/Charcoal
                        fern: '#415A77',       // Muted Blue-Grey
                        cream: '#F4F1EA',      // Muted Cream
                        porcelain: '#E0E1DD',  // Light Grey
                        terracotta: '#E07A5F', // Soft Terracotta
                        
                        // Semantic mapping
                        surface: '#0D1B2A',    // Main dark background
                        'surface-light': '#1B263B', // Card background
                        text: '#F4F1EA',       // Main text
                        muted: '#778DA9',      // Secondary text
                        accent: '#E07A5F',     // Highlights
                    },
                    backgroundImage: {
                        'grain': "url('data:image/svg+xml,%3Csvg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"%3E%3Cfilter id=\"noiseFilter\"%3E%3CfeTurbulence type=\"fractalNoise\" baseFrequency=\"0.65\" numOctaves=\"3\" stitchTiles=\"stitch\"/%3E%3C/filter%3E%3Crect width=\"100%25\" height=\"100%25\" filter=\"url(%23noiseFilter)\" opacity=\"0.05\"/%3E%3C/svg%3E')",
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/custom.css">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <!-- Included for modal potential usage -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="bg-midnight text-porcelain font-sans antialiased selection:bg-terracotta selection:text-white relative overflow-x-hidden">

    <!-- Grain Overlay -->
    <div class="fixed inset-0 pointer-events-none bg-grain opacity-20 z-[100]"></div>

    <!-- Navigation -->
    <nav class="fixed w-full bg-midnight/90 backdrop-blur-md z-40 border-b border-white/5">
        <div class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-12">
            <div class="flex justify-between items-center h-24">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html" class="text-2xl font-serif font-semibold text-porcelain tracking-tight hover:text-terracotta transition-colors duration-300">
                        AR<span class="text-terracotta">.</span>
                    </a>
                </div>
                
                <!-- Desktop Menu -->
                <div class="hidden md:flex space-x-12">
                    <a href="index.html" class="nav-link text-xs font-mono font-medium uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-all duration-300">Home</a>
                    <a href="experience.html" class="nav-link text-xs font-mono font-medium uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-all duration-300">Experience</a>
                    <a href="projects.html" class="nav-link text-xs font-mono font-medium uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-all duration-300">Projects</a>
                    <a href="blog.html" class="nav-link text-xs font-mono font-medium uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-all duration-300">Blog</a>
                </div>
                
                <!-- Mobile Menu Button -->
                <div class="flex items-center md:hidden">
                    <button id="mobile-menu-btn" class="text-porcelain hover:text-terracotta focus:outline-none transition-colors">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-midnight border-t border-white/5 absolute w-full">
            <div class="px-6 py-6 space-y-4">
                <a href="index.html" class="block text-sm font-mono uppercase tracking-widest text-terracotta">Home</a>
                <a href="experience.html" class="block text-sm font-mono uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-colors">Experience</a>
                <a href="projects.html" class="block text-sm font-mono uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-colors">Projects</a>
                <a href="blog.html" class="block text-sm font-mono uppercase tracking-widest text-porcelain/60 hover:text-terracotta transition-colors">Blog</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow pt-24">
        
        <!-- Hero Section -->
        <section class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-12 min-h-[90vh] flex flex-col justify-center relative">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-12 md:gap-24 items-center">
                
                <!-- Text Content -->
                <div class="md:col-span-7 fade-in-section order-2 md:order-1">
                    <span id="hero-title" class="text-terracotta font-mono text-xs uppercase tracking-[0.2em] mb-6 block pl-1 border-l-2 border-terracotta">Data Scientist</span>
                    
                    <h1 id="hero-name" class="text-5xl md:text-7xl lg:text-8xl font-serif font-medium text-porcelain mb-8 leading-tight tracking-tight">
                        Alex<br>Redshaw
                    </h1>
                    
                    <p id="hero-tagline" class="text-lg md:text-xl text-fern font-light leading-relaxed max-w-lg mb-12 border-l border-white/10 pl-6">
                        <!-- Content loaded via JS -->
                    </p>
                    
                    <div class="flex flex-wrap gap-6">
                        <a href="projects.html" class="group relative px-8 py-4 bg-terracotta text-midnight font-mono text-xs uppercase tracking-widest hover:bg-white transition-all duration-300">
                            <span class="relative z-10 font-bold">View Projects</span>
                            <div class="absolute inset-0 border border-terracotta group-hover:border-white transition-colors duration-300 translate-x-1 translate-y-1 -z-10 group-hover:translate-x-0 group-hover:translate-y-0"></div>
                        </a>
                        
                        <a href="#" id="resume-btn" class="group relative px-8 py-4 bg-transparent text-porcelain font-mono text-xs uppercase tracking-widest border border-white/20 hover:border-terracotta hover:text-terracotta transition-all duration-300 flex items-center gap-3">
                            <i data-lucide="download" class="w-4 h-4"></i>
                            <span>Resume</span>
                        </a>
                    </div>
                    
                    <div class="mt-16 flex gap-6" id="hero-socials">
                        <!-- Social icons loaded via JS -->
                    </div>
                </div>
                
                <!-- Image/Visual -->
                <div class="md:col-span-5 flex justify-end fade-in-section order-1 md:order-2 relative">
                    <div class="relative w-full aspect-[4/5] md:w-80 md:h-[28rem] lg:w-96 lg:h-[32rem]">
                        <div class="absolute inset-0 border border-white/10 translate-x-4 translate-y-4"></div>
                        <div class="absolute inset-0 bg-charcoal w-full h-full overflow-hidden">
                            <img id="hero-image" src="" alt="Alex Redshaw" class="w-full h-full object-cover opacity-80 mix-blend-luminosity hover:mix-blend-normal transition-all duration-700 grayscale hover:grayscale-0">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Scroll Indicator -->
            <div class="absolute bottom-12 left-1/2 transform -translate-x-1/2 hidden md:flex flex-col items-center animate-bounce">
                <span class="text-[10px] font-mono uppercase tracking-widest text-fern mb-2">Scroll</span>
                <div class="w-[1px] h-12 bg-fern/30"></div>
            </div>
        </section>

        <!-- About Section -->
        <section class="border-t border-white/5 py-32 bg-midnight/50">
            <div class="max-w-4xl mx-auto px-6 sm:px-8 lg:px-12 fade-in-section">
                <div class="text-center mb-16">
                    <span class="text-terracotta font-mono text-xs uppercase tracking-[0.2em] mb-4 block">Manifesto</span>
                    <h2 class="text-3xl md:text-5xl font-serif text-porcelain">About Me</h2>
                </div>
                
                <div id="about-text" class="prose prose-invert prose-lg mx-auto text-center font-light leading-loose text-fern">
                    <!-- About content loaded via JS -->
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-white/5 py-12 bg-midnight">
        <div class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-12 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="text-fern text-xs font-mono uppercase tracking-widest">
                &copy; <span id="current-year"></span> Alex Redshaw.
            </div>
            <div class="flex gap-8" id="footer-socials">
                <!-- Social Links Loaded via JS -->
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
