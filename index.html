<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Redshaw - Data Scientist</title>
    <meta name="description" content="Portfolio of Alex Redshaw, a Data Scientist specializing in Machine Learning and NLP.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        navy: '#0f172a',
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/custom.css">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <!-- Included for modal potential usage -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="fixed w-full bg-white/90 backdrop-blur-md z-50 border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html" class="text-xl font-bold text-slate-900 tracking-tight">Alex Redshaw<span class="text-blue-600">.</span></a>
                </div>
                
                <!-- Desktop Menu -->
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="nav-link text-sm font-medium transition-colors">Home</a>
                    <a href="experience.html" class="nav-link text-sm font-medium transition-colors">Experience</a>
                    <a href="projects.html" class="nav-link text-sm font-medium transition-colors">Projects</a>
                    <a href="blog.html" class="nav-link text-sm font-medium transition-colors">Blog</a>
                </div>
                
                <!-- Mobile Menu Button -->
                <div class="flex items-center md:hidden">
                    <button id="mobile-menu-btn" class="text-slate-600 hover:text-slate-900 focus:outline-none">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-slate-100">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="index.html" class="block px-3 py-2 rounded-md text-base font-medium text-blue-600 bg-blue-50">Home</a>
                <a href="experience.html" class="block px-3 py-2 rounded-md text-base font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50">Experience</a>
                <a href="projects.html" class="block px-3 py-2 rounded-md text-base font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50">Projects</a>
                <a href="blog.html" class="block px-3 py-2 rounded-md text-base font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50">Blog</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow pt-16">
        
        <!-- Hero Section -->
        <section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-20 md:py-32 flex flex-col-reverse md:flex-row items-center gap-12">
            <div class="w-full md:w-1/2 fade-in-section">
                <span id="hero-title" class="text-blue-600 font-semibold tracking-wide uppercase text-sm mb-2 block">Data Scientist</span>
                <h1 id="hero-name" class="text-4xl md:text-6xl font-bold text-slate-900 mb-6 leading-tight">Alex Redshaw</h1>
                <p id="hero-tagline" class="text-lg md:text-xl text-slate-600 mb-8 leading-relaxed max-w-lg"></p>
                
                <div class="flex flex-wrap gap-4">
                    <a href="projects.html" class="px-6 py-3 bg-blue-600 text-white font-medium rounded-lg shadow-md hover:bg-blue-700 transition-colors transform hover:-translate-y-0.5">View Projects</a>
                    <a href="#" id="resume-btn" class="px-6 py-3 bg-white text-slate-700 border border-slate-300 font-medium rounded-lg shadow-sm hover:bg-slate-50 transition-colors flex items-center gap-2">
                        <i data-lucide="download" class="w-4 h-4"></i> Resume
                    </a>
                </div>
                
                <div class="mt-8 flex gap-4" id="hero-socials">
                    <!-- Social icons will be cloned from footer or loaded separately if needed, but for now relying on footer -->
                </div>
            </div>
            
            <div class="w-full md:w-1/2 flex justify-center md:justify-end fade-in-section">
                <div class="relative w-64 h-64 md:w-80 md:h-80">
                    <div class="absolute inset-0 bg-blue-200 rounded-full blur-2xl opacity-50 animate-pulse"></div>
                    <img id="hero-image" src="" alt="Alex Redshaw" class="relative w-full h-full object-cover rounded-full border-4 border-white shadow-xl">
                </div>
            </div>
        </section>

        <!-- About Section -->
        <section class="bg-white py-20">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 fade-in-section">
                <div class="text-center mb-12">
                    <h2 class="text-3xl font-bold text-slate-900">About Me</h2>
                    <div class="w-16 h-1 bg-blue-600 mx-auto mt-4 rounded-full"></div>
                </div>
                
                <div id="about-text" class="prose prose-lg mx-auto text-center text-slate-600">
                    <!-- About content loaded via JS -->
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-12">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="text-slate-500 text-sm">
                &copy; <span id="current-year"></span> Alex Redshaw. All rights reserved.
            </div>
            <div class="flex gap-6" id="footer-socials">
                <!-- Social Links Loaded via JS -->
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
